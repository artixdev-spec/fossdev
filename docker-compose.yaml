services:
  product_service:
    build: ./product_service
    ports:
      - "8001:8000"

  order_service:
    build: ./order_service
    ports:
      - "8002:8000"
    environment:
      # внутри сети compose сервисы видят друг друга по имени
      PRODUCT_SERVICE_URL: http://product_service:8000
    depends_on:
      - product_service
