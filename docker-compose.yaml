services:
  product_service:
    build: ./product_service
    ports:
      - "8001:8000"

  order_service:
    build: ./order_service
    ports:
      - "8002:8000"
    environment:
      # внутри сети compose сервисы видят друг друга по имени
      PRODUCT_SERVICE_URL: http://product_service:8000
      DATABASE_URL: postgresql://app:app@db:5432/orders
    depends_on:
      product_service:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
